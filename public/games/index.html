<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games · TikTok Live Bridge</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #151a24;
      --line: #232b3a;
      --text: #e6ecf5;
      --dim: #8b97ab;
      --accent: #4cc9f0;
      --green: #3ddc84;
      --yellow: #ffd166;
      --red: #ff5d73;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1a2130 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px;
    }
    .brand { text-align: center; margin-bottom: 8px; }
    .brand .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); margin-right: 8px; }
    .brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .3px; }
    .brand p { margin: 6px 0 0; color: var(--dim); font-size: 13px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
      margin-top: 36px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      text-decoration: none;
      color: var(--text);
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(76, 201, 240, .15);
    }
    .card .icon { font-size: 30px; }
    .card .name { font-size: 17px; font-weight: 700; }
    .card .desc { font-size: 13px; color: var(--dim); line-height: 1.5; flex: 1; }
    .card .url { font-size: 12px; color: var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .empty { color: var(--dim); font-size: 14px; }
  </style>
</head>
<body>
  <div class="brand">
    <span class="dot"></span>
    <h1>TikTok Live Bridge · Games</h1>
    <p>Mở game bằng link bên dưới (dán vào OBS Browser Source là chạy).</p>
  </div>
  <div class="grid" id="games"></div>

  <script>
    const games = [
      {
        icon: "🪚",
        name: "Đấu trường lưỡi cưa",
        desc: "FFA trong sân đấu hình vuông. Comment để vào phòng, tích tap tim, follow/share và tặng quà để có lưỡi cưa & chiêu thức.",
        url: "/games/saw-arena/",
      },
    ];
    const grid = document.getElementById("games");
    grid.innerHTML = games
      .map(
        (g) => `
      <a class="card" href="${g.url}">
        <span class="icon">${g.icon}</span>
        <span class="name">${g.name}</span>
        <span class="desc">${g.desc}</span>
        <span class="url">${location.origin}${g.url}</span>
      </a>`
      )
      .join("");
  </script>
</body>
</html>
