<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Live Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dash-body">
  <header class="dash-header">
    <h1>TikTok Live Dashboard</h1>
    <div id="dash-connection" class="dash-connection">
      <span id="dash-status-dot" class="dash-dot"></span>
      <span id="dash-status-text">Đang tải...</span>
    </div>
  </header>

  <main class="dash-main">
    <section class="dash-grid">
      <div class="dash-card">
        <h2>Tài khoản</h2>
        <form id="config-form">
          <label for="username-input">Username TikTok đang live</label>
          <div class="dash-row">
            <input id="username-input" type="text" placeholder="vd: nhn.3021" autocomplete="off" required />
            <button id="save-btn" type="submit" class="btn">Lưu</button>
          </div>
          <p id="config-msg" class="dash-msg"></p>
        </form>
        <div class="dash-meta">
          <span>Room ID:</span><strong id="room-id">-</strong>
        </div>
      </div>

      <div class="dash-card">
        <h2>Thống kê phiên</h2>
        <div class="dash-stats">
          <div class="stat-box">
            <span class="stat-value" id="stat-viewers">0</span>
            <span class="stat-label">👁 Viewers</span>
          </div>
          <div class="stat-box">
            <span class="stat-value" id="stat-comments">0</span>
            <span class="stat-label">💬 Cmt</span>
          </div>
          <div class="stat-box">
            <span class="stat-value" id="stat-likes">0</span>
            <span class="stat-label">❤️ Likes</span>
          </div>
          <div class="stat-box">
            <span class="stat-value" id="stat-gifts">0</span>
            <span class="stat-label">🎁 Quà</span>
          </div>
          <div class="stat-box">
            <span class="stat-value" id="stat-diamonds">0</span>
            <span class="stat-label">💎 Kim cương</span>
          </div>
          <div class="stat-box">
            <span class="stat-value" id="stat-duration">0s</span>
            <span class="stat-label">⏱ Phiên</span>
          </div>
        </div>
      </div>
    </section>

    <section class="dash-grid">
      <div class="dash-card">
        <h2>Top người tặng quà</h2>
        <table class="dash-table">
          <thead>
            <tr><th>#</th><th>Người dùng</th><th>Kim cương</th><th>Lần tặng</th></tr>
          </thead>
          <tbody id="top-senders-body">
            <tr><td colspan="4" class="dash-empty">Chưa có dữ liệu</td></tr>
          </tbody>
        </table>
      </div>

      <div class="dash-card">
        <h2>Sự kiện gần đây</h2>
        <ul id="recent-feed" class="dash-feed">
          <li class="dash-empty">Chưa có sự kiện</li>
        </ul>
      </div>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
