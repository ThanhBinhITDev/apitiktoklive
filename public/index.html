<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Live Overlay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="overlay">
    <div id="notification-layer"></div>
    <div id="gift-layer"></div>
    <div id="like-layer"></div>
    <div id="tapper-label" hidden></div>
    <div id="chat-layer"></div>
  </div>

  <div id="status-bar" hidden>
    <span id="status-dot"></span>
    <span id="status-text">Đang kết nối...</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
